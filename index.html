<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />

    <title>NOA-oefenen · Geneeskunde Erasmus MC</title>
    <script>
      // Zet het thema meteen, zodat de pagina niet eerst wit flitst.
      try {
        var s = JSON.parse(localStorage.getItem('noa-oefenen-v1') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
  </head>
